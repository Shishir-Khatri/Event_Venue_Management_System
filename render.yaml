services:
  - type: web
    name: event-management-system
    runtime: node
    branch: development
    plan: free
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: MONGO_URI
        sync: false
      - key: PUBLIC_BASE_URL
        sync: false
      - key: FRONTEND_URL
        sync: false
      - key: BACKEND_URL
        sync: false
      - key: AUTH_COOKIE_NAME
        value: ems_token
      - key: KHALTI_ENV
        value: sandbox
      - key: KHALTI_SECRET_KEY
        sync: false
      - key: ESEWA_ENV
        value: sandbox
      - key: ESEWA_PRODUCT_CODE
        value: EPAYTEST
      - key: ESEWA_SECRET_KEY
        value: 8gBm/:&EnhH.1/q

